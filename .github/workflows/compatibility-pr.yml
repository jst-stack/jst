name: Prepare compatibility release branch

on:
  workflow_dispatch:
    inputs:
      template-version:
        description: Next template version without the v prefix
        required: true
        type: string
      plugin-version:
        description: Published @jst-stack/eslint-plugin version
        required: true
        type: string
      summary:
        description: One-line user-visible release summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: compatibility-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - run: npm ci
      - name: Update compatibility and release notes
        run: >-
          node scripts/prepare-compatibility-release.mjs
          --template-version "${{ inputs.template-version }}"
          --plugin-version "${{ inputs.plugin-version }}"
          --summary "${{ inputs.summary }}"
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm run validate
      - name: Push reviewed release branch
        env:
          BRANCH: automation/compatibility-v${{ inputs.template-version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$BRANCH"
          git add CHANGELOG.md docs/compatibility.md docs/versions.md jst.compatibility.json jst.template.json package.json package-lock.json
          git commit -m "release: prepare template v${{ inputs.template-version }}"
          git push --force-with-lease origin "$BRANCH"
          echo "Open a pull request: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1" >> "$GITHUB_STEP_SUMMARY"
